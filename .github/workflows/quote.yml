name: Daily quote

on:
  schedule:
    - cron: "0 0 * * *"  # every day at midnight UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch quote and update README
        run: |
          python3 << 'EOF'
          import urllib.request, json, re

          with urllib.request.urlopen("https://zenquotes.io/api/random") as r:
              data = json.loads(r.read())[0]
          quote = f"> {data['q']} — **{data['a']}**"

          with open("README.md", "r") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- QUOTE-START -->.*?<!-- QUOTE-END -->",
              f"<!-- QUOTE-START -->\n{quote}\n<!-- QUOTE-END -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(new_content)
          EOF
